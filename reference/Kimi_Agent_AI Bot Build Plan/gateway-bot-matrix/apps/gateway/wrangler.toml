name = "gateway-bot-matrix"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# Environment variables (set via wrangler secret)
[vars]
ENVIRONMENT = "production"

# Rate limiting (optional)
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
# 100 requests per minute
simple = { limit = 100, period = 60 }
