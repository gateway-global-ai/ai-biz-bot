        type_ref: string
    endpoint_flow:
      steps: []
      completion_predicate: No HTTP; governance artifact only.
    side_effect_level: none
    tool_name: null
    operational_mode_allowlist: null
    confidence: low
    fallback:
      mode: refuse
      user_visible_message_ref: integration.fallback.not_applicable_discovery
      max_retries: 0

  - capability_id: cb_gql_relationship_inspect
    spec_version: "1.0.0"
    vendor_id: cloudbeds_graphql
    title: GraphQL relationship graph (discovery)
    description: >
      Document nested relationships (e.g. reservation to guest) vs REST for merge-order and resolver design.
    mutation_level: read
    required_anchors: []
    credential_anchor_ref: site_pms_integrations:cloudbeds
    required_scope_ids: []
    allowed_version_lanes: [cloudbeds_gql_discovery_v1]
    optional_anchors: []
