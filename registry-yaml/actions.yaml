version: 1
actions:
- actionId: intake.approve
  entity: intakeChangeRequests
  allowedEntities:
  - intakeChangeRequests
  requiredContextKeys:
  - siteConfigId
  - requestId
  requiredPolicy: intake.approve
  mutationClass: controlled
  mutationLevel: controlled
  handler: intake/approveRequest
  domainHandler: intake/approveRequest
  requiresConfirmation: true
  safeModeBehavior: require_human_confirmation
  auditEvent: intake.approved
  description: 'Approves a pending intake change request.

    '
- actionId: form.approve
  entity: intakeChangeRequests
  allowedEntities:
  - intakeChangeRequests
  requiredContextKeys:
  - siteConfigId
  - requestId
  requiredPolicy: form.approve
  mutationClass: controlled
  mutationLevel: controlled
  handler: intake/approveForm
  domainHandler: intake/approveForm
  requiresConfirmation: true
  safeModeBehavior: require_human_confirmation
  auditEvent: form.approved
  description: 'Approves a submitted form.

    '
- actionId: agent.updateBehavior
  entity: agents
  allowedEntities:
