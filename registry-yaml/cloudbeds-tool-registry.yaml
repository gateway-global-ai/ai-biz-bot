# ── Governance ────────────────────────────────────────────────────────────────
governance:
  voice_note: >
    VOICE_BOARDWALK_DEMO_NOTE.md: geminiVoice.ts injects PRICING_RULE anti-booking copy
    that can contradict live inventory quotes in spoken demos. Do NOT modify geminiVoice.ts
    as a side effect of this integration. Open a separate voice governance task before
    running a live voice demo that quotes real rates.
  no_new_routes: >
    Tools are server-side only. No new routes added to server/routes.ts.
    cloudbedsRoutes.ts handles OAuth and reservation proxy.
  sms_payment_links: >
    Payment links use POST /api/share/send-payment-link with CUSTOMER_CARE pipe.
    Never use marketing SMS pipe for checkout flows.
  pms_credentials: >
    All Cloudbeds credentials stored per-site in site_pms_integrations.
    Global Doppler CLOUDBEDS_* vars are fallback only (legacy + smoke tests).
