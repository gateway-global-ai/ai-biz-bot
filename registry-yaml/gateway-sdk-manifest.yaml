# Gateway SDK manifest — governed components for Design Studio + product surfaces
# Authority: docs-governance/canonical/AI_DESIGN_STUDIO_GOVERNED_SPEC_V1.md
version: 1
spec_ref: docs-governance/canonical/AI_DESIGN_STUDIO_GOVERNED_SPEC_V1.md

themes_allowed:
  - light-apple
  - dark-apple
  - crystal-glass

global_prohibited:
  - inline_style
  - raw_color
  - unregistered_import

entries:
  - id: sovereign-button
    type: primitive
    source: internal
    import: "@/ui-core"
    export_name: SovereignButton
    themes_supported: [light-apple, dark-apple, crystal-glass]
    allowed_props:
      sovereignVariant: [primary, secondary, outlined, text]
      children: string
    prohibited: [inline_style, raw_color]

  - id: sovereign-card
    type: primitive
    source: internal
    import: "@/ui-core"
    export_name: SovereignCard
    themes_supported: [light-apple, dark-apple, crystal-glass]
    allowed_props:
      children: any
    prohibited: [inline_style, raw_color]

  - id: sovereign-form-field
    type: primitive
    source: internal
    import: "@/ui-core"
    export_name: SovereignFormField
    themes_supported: [light-apple, dark-apple, crystal-glass]
    allowed_props:
      label: string
      value: string
    prohibited: [inline_style, raw_color]

  - id: sovereign-section-header
    type: widget
    source: internal
    import: "@/ui-core"
    export_name: SovereignSectionHeader
    themes_supported: [light-apple, dark-apple, crystal-glass]
    allowed_props:
      title: string
      subtitle: string
    prohibited: [inline_style, raw_color]

  - id: sovereign-page-shell
    type: screen
    source: internal
    import: "@/ui-core"
    export_name: SovereignPageShell
    themes_supported: [light-apple, dark-apple, crystal-glass]
    allowed_props:
      children: any
    prohibited: [inline_style, raw_color]

  - id: ai-transcription
    type: block
    source: shadcn-promoted
    import: "@/components/ai-blocks"
    export_name: SovereignTranscription
    sdk_ref: shadcn.io/ai/transcription
    themes_supported: [light-apple, dark-apple]
    allowed_props:
      entries: TranscriptEntry[]
      isListening: boolean
    prohibited: [inline_style, raw_color]

  - id: ai-prompt-input
    type: block
    source: shadcn-promoted
    import: "@/components/ai-blocks"
    export_name: SovereignPromptInput
    sdk_ref: shadcn.io/ai/prompt-input
    themes_supported: [light-apple, dark-apple]
    allowed_props:
      onSubmit: function
      placeholder: string
      disabled: boolean
    prohibited: [inline_style, raw_color]

  - id: ai-voice-selector
    type: block
    source: shadcn-promoted
    import: "@/components/ai-blocks"
    export_name: SovereignVoiceSelector
    sdk_ref: shadcn.io/ai/voice-selector
    themes_supported: [light-apple, dark-apple]
    allowed_props:
      voices: VoiceOption[]
      selectedVoiceId: string
      onSelect: function
      onPreview: function
    prohibited: [inline_style, raw_color]

  - id: ai-task-queue
    type: block
    source: shadcn-promoted
    import: "@/components/ai-blocks"
    export_name: SovereignTaskQueue
    sdk_ref: shadcn.io/ai/queue
    themes_supported: [light-apple, dark-apple]
    allowed_props:
      tasks: TaskItem[]
    prohibited: [inline_style, raw_color]

  - id: shadcn-placeholder-promotion
    type: primitive
    source: shadcn
    import: null
    export_name: null
    promotion_status: discovery_only
    themes_supported: []
    allowed_props: {}
    prohibited: [inline_style, raw_color, direct_product_import]
