# Agent capability — coding_agent (local internal worker)
# Aligns with .cursor/rules/local-agent-governance.mdc (coding_agent jurisdiction)
spec: agent_capability_v0
id: coding_agent
version: "0.1.0"
display_name: Coding Agent (local worker)
plane: internal_worker_runtime

authority:
  source_of_truth: registry-yaml/agent-capabilities/coding_agent.v0.yaml
  derived_fields:
    - agents.structuredControls.forbidden_domains
    - agents.structuredControls.allowed_domains

plane_status:
  customer_facing_runtime: active
  internal_worker_runtime: active
  background_scheduled: reserved_v1

capabilities:
  - id: server_routes_services
    description: Express routes and domain services (non-voice)
    scope:
      paths:
        - server/routes/**
        - server/services/**
      actions:
        - create
        - modify
        - refactor
        - read
  - id: shared_and_schema_migrations
    description: Shared types and Drizzle schema; SQL migrations
    scope:
      paths:
        - shared/**
        - migrations/**
      actions:
        - create
        - modify
        - refactor
        - read
  - id: tooling_scripts
    description: Maintenance and bootstrap scripts
    scope:
      paths:
        - scripts/**
      actions:
        - create
        - modify
        - refactor
        - read
  - id: client_application
    description: Frontend application code (excluding voice runtime)
    scope:
      paths:
        - client/src/**
      actions:
        - create
        - modify
        - refactor
        - read

boundaries:
  # forbidden_paths override overlapping allowed_paths (same as local-agent-governance.mdc)
  forbidden_logical_domains:
    - voice_runtime
    - customer_channel
  forbidden_paths:
    - server/geminiVoice.ts
    - server/voiceStream.ts
    - server/voiceGemini.ts
    - server/voiceSession.ts
    - server/audioCodec.ts
    - server/config/geminiLiveProtocol.ts
    - client/src/services/voice/**
    - client/public/clear-voice-processor.js
  allowed_logical_domains:
    - server_plane
    - migrations_plane
    - scripts_plane
    - shared_library
    - client_source
  allowed_paths:
    - server/routes/**
    - server/services/**
    - shared/**
    - migrations/**
    - scripts/**
    - client/src/**

contracts:
  input:
    taskType: code
    payload_schema_ref: null
  output:
    format: local_agent_output
    parse_required: true

execution:
  deterministic_output_required: true
  structured_output_only: true

orchestration:
  requires_run_row: true
  violation_types:
    - missing_orchestration_run
    - unauthorized_domain_access
    - local_model_voice_path_attempt

escalation:
  on_boundary_hit: fail_closed
  handoff_to:
    - governance_review

tests:
  npm_scripts:
    - test:local-agent-aptitude
  scenarios: []

scoring:
  violation_registry: agent_orchestration_runs.violation_type
  readiness_hooks:
    - integration:readiness

governance:
  policy_refs:
    - docs-governance/canonical/AGENT_POLICY_REGISTRY.md
    - docs-governance/canonical/SAFE_MODE_CONTRACT.md
  review_required: true
