# Policy Gates Registry — the single authority for gate definitions.
#
# Every gate in the system MUST be declared here. The policyGateCatalog
# loads this at boot. evaluatePolicyDecision checks against it.
# If a gate is not here, it is denied.
#
# This replaces:
#   - ALPHA_ALLOWED_GATES hardcoded Set in evaluatePolicyGate.ts
#   - ACTOR_GATED hardcoded map
#   - ESCALATION_GATES hardcoded set
#   - SERVER_POLICY_GATES in server/middleware/policyGate.ts
#   - POLICY_ROLE_ALLOWLIST in server/utils/siteScopedAccess.ts
#
# Validated by: npm run validate:policy-gates (future)
# Consumed by: os-core/control-plane/policy-registry/policyGateCatalog.ts

spec: policy_gates_registry_v1
version: "1.0.0"

authority:
  source_of_truth: registry-yaml/policy-gates.yaml
  doctrine_reference: docs-governance/canonical/AI_OS_OPERATING_DOCTRINE_V1.md

# ── Gate definitions ──────────────────────────────────────────────────────
#
# Each gate declares:
#   gate_id:             unique identifier (matches requiredPolicy / policyGate in other registries)
#   description:         human-readable purpose
#   allowed_actor_classes: which actor classes can access (empty = any authenticated)
#   anonymous_allowed:   true if no auth required
#   mutation_level:      none | read_only | controlled | sensitive
#   escalation_rule:     none | management_review | approval_required
#   doctrine_ref:        which doctrine principle this gate enforces

gates:
  # ── OS boot & public ──────────────────────────────────────────────────
