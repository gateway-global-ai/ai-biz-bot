name: Intent Execution Evidence Check

on:
  pull_request:
    branches: [main, dev]

jobs:
  intent-execution-evidence:
    name: Intent Execution Evidence
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Validate coding intent evidence marker
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: npx tsx scripts/intent-execution-evidence-check.ts
