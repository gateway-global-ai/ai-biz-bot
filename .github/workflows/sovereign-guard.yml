name: Sovereign Guard

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  sovereign-guard:
    name: Rule Enforcement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run Sovereign Guard + governance artifact gate (single lane)
        run: |
          # On PRs, scan all changed files vs base branch
          # On push to main, scan files changed in the last commit
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD)
          fi

          echo "Files to scan:"
          echo "$CHANGED"
          echo ""

          echo "$CHANGED" > /tmp/changed-files.txt
          npx tsx scripts/sovereign-guard.ts --file-list /tmp/changed-files.txt
          # Phase 1 inventory TBD + visual baseline + Option C SMS + anti-artboard on changed client files
          npx tsx scripts/sovereign-gate-governance.ts --file-list /tmp/changed-files.txt

      - name: Anti-artboard UI governance (canvas + command center host)
        run: npx tsx scripts/check-ui-governance.ts --ci

      - name: Validate integration registry
        run: npm run validate:integration-registry

      - name: Validate swarm schematic
        run: npm run validate:swarm-schematic

      - name: Validate agent classification policy
        run: npm run validate:agent-classification

      - name: Validate onboarding contract hash (determinism)
        run: npm run validate:onboarding-contract-hash

      - name: Admission contract gate (unit)
        run: npm run test:admission-contract-gate

      - name: Check env manifest cleanliness
        run: npx tsx scripts/check-env-manifest.ts
        if: always()
