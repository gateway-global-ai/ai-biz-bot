# FAILURE_LOG — Production Simulation Week 0
#
# This artifact captures failures observed during controlled production
# simulation. It is the primary input for the v1 boundary decision.
#
# RULE: Entries are added ONLY during or after Production Simulation Week 0.
#       Do not pre-populate from architecture assumptions or code inspection.
#       Every entry must come from observed runtime behavior.
#
# RULE: No failure may be dismissed without a severity classification
#       and an explicit fix_required decision.

version: "1.0"
created: "2026-03-25"
authority: governance/TRUTH_REGISTRY.yaml
phase: "production_simulation_week_0"

# ─── SCHEMA ─────────────────────────────────────────────────────────────────
#
# Each failure entry MUST contain ALL of the following fields:
#
#   id:              string   — unique identifier (F001, F002, ...)
#   session_id:      string   — Week 0 session identifier (W0-S001, W0-S002, ...)
#   type:            string   — failure category (see FOCUS CLASSES below)
#   description:     string   — what happened, not what you expected
#   location:        string   — file path, route, or subsystem where it occurred
#   severity:        enum     — critical | high | medium | low
#   owner:           enum     — governance | runtime | ui | data | voice
#   observed_under:  enum     — simulation | staging | live
#   reproducible:    boolean  — true | false
#   fix_required:    boolean  — true | false
#   steps_to_reproduce: string (optional) — how to trigger the failure
#   related_failures:  list   (optional) — ids of related failures
#   resolution:        string (optional) — what was done to fix it
#   resolved_at:       string (optional) — date of resolution
#
# ─── FOCUS FAILURE CLASSES (Week 0 scope) ───────────────────────────────────
#
#   governance_conflict  — two or more rules/policies triggered conflicting actions
#   policy_bypass        — anything slipped around the enforcement gate
#   state_inconsistency  — wrong or stuck state transitions
#   silent_failure       — no output, no error, no visible state change
#   non_determinism      — same input produced different outputs
#   recovery_failure     — could not retry or resume after error
#
#   Ignore all other failure types during Week 0.
#
# ─── GUARDRAILS ─────────────────────────────────────────────────────────────
#
#   1. NO SILENT SUCCESS: If a step completes without an event, a log,
#      or a visible state change, treat it as a silent_failure and log it.
#
#   2. ONE FAILURE = ONE ENTRY: Do not bundle issues. Each failure gets
#      its own id, its own location, its own severity.
#
# ─── WHAT TO LOG ────────────────────────────────────────────────────────────
#
#   Log ONLY if it:
#     - broke
#     - behaved inconsistently
#     - violated governance
#     - failed silently
#
#   Do NOT log ideas, improvements, or wish-list items.
#
# ─── SEVERITY DEFINITIONS ───────────────────────────────────────────────────
#
#   critical  — system cannot function; data loss; security breach;
#               enforcement bypass that allows ungoverned execution
#   high      — feature broken; user-visible failure; state corruption
#               that requires manual intervention
#   medium    — degraded behavior; workaround exists; non-blocking
#               but reduces confidence in the system
#   low       — cosmetic; edge case; does not affect core flows
#               or governance integrity
#
# ─── OWNER DOMAINS ──────────────────────────────────────────────────────────
#
#   governance — authority hierarchy, enforcement gates, policy rules
#   runtime    — server execution, routing, state machines, provisioning
#   ui         — client rendering, navigation, layout, interaction
#   data       — schema, storage, migrations, data integrity
#   voice      — Gemini Live pipeline, audio codec, WebSocket sessions
#
# ─── OBSERVED_UNDER VALUES ──────────────────────────────────────────────────
#
#   simulation — Production Simulation Week 0 (controlled chaos)
#   staging    — staging environment under test load
#   live       — production traffic (post-v1 launch)

failures: []
