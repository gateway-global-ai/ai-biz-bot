# SURVIVOR_SET — Production Simulation Week 0
#
# This artifact tracks which features survive real usage under pressure.
# It is the primary input for the v1 feature boundary.
#
# RULE: No feature may be promoted out of "unverified" until it has been
#       exercised during Production Simulation Week 0.
#
# RULE: Entries are added ONLY after a feature is actually tested under
#       real conditions. Do not pre-populate from architecture, code
#       inspection, or documentation. "Wired" is not "survived."
#
# RULE: A feature with status "stable_with_warnings" MUST reference
#       the related failure IDs from FAILURE_LOG.yaml.
#
# RULE: A feature with status "excluded_from_v1" MUST have an
#       exclusion_reason. No silent exclusions.

version: "1.0"
created: "2026-03-25"
authority: governance/TRUTH_REGISTRY.yaml
phase: "production_simulation_week_0"

# ─── SCHEMA ─────────────────────────────────────────────────────────────────
#
# Each survivor entry MUST contain ALL of the following fields:
#
#   feature:          string   — human-readable feature name
#   status:           enum     — unverified | stable | stable_with_warnings | excluded_from_v1
#   exercised:        boolean  — true only after real production simulation testing
#   revenue_critical: boolean  — true if this feature directly generates or protects revenue
#   owner:            enum     — governance | runtime | ui | data | voice
#   session_ids:      list     — Week 0 session IDs where this feature was exercised (>=2 required for promotion)
#   tested_at:        string   (optional) — date of last exercise
#   related_failures: list     (optional) — failure IDs from FAILURE_LOG.yaml
#   exclusion_reason: string   (required if status = excluded_from_v1)
#   notes:            string   (optional) — observations from testing
#
# ─── STATUS DEFINITIONS ─────────────────────────────────────────────────────
#
#   unverified           — exists in code but has NOT been exercised under
#                          production simulation. Default state for all entries.
#                          No feature ships as v1 in this state.
#
#   stable               — exercised during Week 0, no failures observed,
#                          behaves deterministically under load. Candidate for v1.
#
#   stable_with_warnings — exercised during Week 0, works but has known
#                          issues (referenced in FAILURE_LOG.yaml). May ship
#                          in v1 if warnings are non-critical.
#
#   excluded_from_v1     — explicitly removed from v1 scope. Must have
#                          exclusion_reason. May be reconsidered for v2+.
#
# ─── OWNER DOMAINS ──────────────────────────────────────────────────────────
#
#   governance — authority hierarchy, enforcement gates, policy rules
#   runtime    — server execution, routing, state machines, provisioning
#   ui         — client rendering, navigation, layout, interaction
#   data       — schema, storage, migrations, data integrity
#   voice      — Gemini Live pipeline, audio codec, WebSocket sessions
#
# ─── HOW ENTRIES ARE ADDED ──────────────────────────────────────────────────
#
# During Production Simulation Week 0:
#
#   1. Exercise a feature under real conditions in a named session (W0-S001, etc.)
#   2. Add an entry with status: unverified, exercised: false
#   3. After testing, set exercised: true and record session_ids
#   4. If failures occurred, log them in FAILURE_LOG.yaml first,
#      then reference the failure IDs here
#   5. After Week 0 concludes, any feature still "unverified" is
#      automatically excluded_from_v1
#
# ─── PROMOTION RULES (binding) ─────────────────────────────────────────────
#
#   unverified → excluded_from_v1     (automatic if not exercised)
#   unverified → stable               (requires: exercised in >=2 sessions,
#                                       zero critical/high failures,
#                                       behavior is repeatable)
#   unverified → stable_with_warnings (requires: exercised in >=2 sessions,
#                                       non-critical failures only,
#                                       all failures referenced by id)
#
# ─── GUARDRAILS ─────────────────────────────────────────────────────────────
#
#   1. NO SILENT SUCCESS: If a step completes without an event, a log,
#      or a visible state change, treat it as a silent_failure in
#      FAILURE_LOG.yaml. Do not mark the feature as stable.
#
#   2. PROMOTION REQUIRES EVIDENCE: A feature needs >=2 session_ids
#      to leave "unverified." Single-session success is not sufficient.
#
# ─── WEEK 0 TEST SESSIONS ──────────────────────────────────────────────────
#
#   W0-S001: Provisioning flow (create -> activate -> retry on failure)
#   W0-S002: Voice concierge core (inbound -> route -> handoff -> follow-up)
#   W0-S003: Communication routing (phone -> SMS -> canvas escalation)
#   W0-S004: State machine (lead create -> qualify -> convert -> follow-up)
#   W0-S005: Policy enforcement (attempt disallowed actions: PII, direct DB, prompt injection)

survivors: []
  # Example (remove when first real entry is added):
