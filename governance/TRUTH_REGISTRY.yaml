# TRUTH REGISTRY — Gateway Global AI OS
# This file is the single authority declaration for the entire system.
# Generated from: docs/architecture/GOVERNANCE_DOCS_AUDIT_REPORT.md (2026-03-25)
#
# Three authority layers:
#   .cursor/rules/*.mdc      = LAW       (enforced every agent interaction)
#   governance/TRUTH_REGISTRY = AUTHORITY (declares what exists)
#   docs-governance/canonical = REFERENCE (explains the law)
#
# Everything else is archived or deleted.

version: "1.0"
authority_date: "2026-03-25"
audit_source: "docs/architecture/GOVERNANCE_DOCS_AUDIT_REPORT.md"

# ─── PRODUCTION ARCHITECTURE ───────────────────────────────────────────────
# These paths contain the REAL, running system. All truth derives from here.

production:
  schema: shared/schema.ts
  storage: server/storage.ts
  routes: server/routes/
  services: server/services/
  enforcement: .cursor/rules/
  client_app: client/src/
  entry_point: server/index.ts

# ─── EXPERIMENTAL ARCHITECTURE ─────────────────────────────────────────────
# os-core/ is a prototype. It is NOT the production runtime.
# Agents must NEVER merge os-core patterns into production without explicit governance task.

experimental:
  path: os-core/
  status: NOT_ACTIVE
  rule: >
    os-core/ contains an 83-file prototype of a future control-plane/execution-plane
    architecture. It is not loaded by server/index.ts. It is not served to users.
    Do not import from os-core/ in server/ or client/src/.
    Do not treat os-core/ views, contracts, or registries as production truth.

# ─── VOICE LOCKDOWN ────────────────────────────────────────────────────────
# These files are frozen infrastructure. Modifications require explicit CTO approval.

voice_lockdown:
  - server/geminiVoice.ts
  - server/voiceStream.ts
  - server/voiceGemini.ts
  - server/voiceSession.ts
  - server/audioCodec.ts
  - server/config/geminiLiveProtocol.ts
  - server/config/geminiSystemInstructions.ts
  - server/config/geminiToolDeclarations.ts
  - client/src/services/voice/**
  - client/public/clear-voice-processor.js

